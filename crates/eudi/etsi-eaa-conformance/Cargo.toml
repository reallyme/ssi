[package]
name = "reallyme-etsi-eaa-conformance"
version = "0.6.1"
description = "Typed ETSI TS 119 472 and EUDI PID conformance policy for ReallyMe SSI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["eudi", "eidas", "etsi", "credentials", "identity"]
categories = ["authentication"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/requirements/*.tsv",
    "/requirements/README.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = []
wasm = []

[dependencies]
email_address = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
