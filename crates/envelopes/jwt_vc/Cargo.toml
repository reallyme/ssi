[package]
name = "envelopes-jwt-vc"
version = "0.2.0"
description = "JWT-VC identity envelope helpers for ReallyMe identity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["jwt-vc-crypto", "reallyme-crypto/native", "reallyme-jose/native"]
wasm = ["jwt-vc-crypto", "reallyme-crypto/wasm", "reallyme-jose/wasm"]
jwt-vc-crypto = [
    "reallyme-crypto/dispatch",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/jwk",
    "reallyme-crypto/signer",
]

[dependencies]
reallyme-ssi-proto = { workspace = true }
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-crypto = { workspace = true }
reallyme-jose = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[lints]
workspace = true
