[package]
name = "reallyme-keys"
version = "0.2.0"
description = "Keyset helpers for ReallyMe identity workflows."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = []
wasm = []

[dependencies]
reallyme-codec = { workspace = true, features = ["base64", "multikey"] }
reallyme-ssi-proto = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
