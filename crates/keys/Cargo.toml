[package]
name = "reallyme-keys"
version = "0.4.1"
description = "Keyset helpers for ReallyMe identity workflows."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["reallyme-crypto/native"]
wasm = ["reallyme-crypto/wasm"]

[dependencies]
reallyme-codec = { workspace = true, features = ["base64", "multikey"] }
reallyme-crypto = { workspace = true, default-features = false, features = ["constant-time", "ed25519", "ml-dsa-87", "ml-kem-768", "ml-kem-1024", "p256", "secp256k1", "x25519"] }
reallyme-ssi-proto = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
