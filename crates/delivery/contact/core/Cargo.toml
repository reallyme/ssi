[package]
name = "identity-presentation-delivery-contact-core"
version = "0.4.2"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
reallyme-ssi-proto = { workspace = true }
reallyme-crypto = { workspace = true, features = ["sha2"] }
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
