[package]
name = "identity-credential-trust-api"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# The portable native surface uses OpenSSL without pulling XMLSec into every
# native consumer. Apple and Android SDK artifacts must remain cross-compilable
# and fail closed when the explicitly packaged XMLSec backend is unavailable.
native = [
    "dep:identity-trust-openssl",
    "dep:identity-trust-tsl-openssl",
    "identity-trust-tsl-openssl/native",
    "reallyme-crypto/native",
]

# System XMLSec is an explicit desktop/server packaging choice. Cargo features
# are globally unified, so target-gating only the dependency cannot safely keep
# this backend out of composed mobile archives.
xmlsec-ffi = ["native", "identity-trust-tsl-openssl/xmlsec-ffi"]

# Optional WASM helper surface used by browser-targeted adapters.
wasm = [
    "dep:identity-trust-wasm",
    "identity-trust-wasm/wasm",
    "reallyme-crypto/wasm",
]

[dependencies]
buffa = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
zeroize = { workspace = true, features = ["derive"] }

# Core trust logic
reallyme-trust-core = { version = "0.1.0", path = "../core" }
identity-revocation-core = { workspace = true }
identity-trust-tsl-core = { version = "0.1.0", path = "../tsl-core" }
reallyme-ssi-proto = { workspace = true }
reallyme-crypto = { workspace = true, features = ["sha2"] }
identity-trust-wasm = { version = "0.1.0", path = "../wasm", optional = true, default-features = false }

# Certificate model
envelopes-x509 = { workspace = true }

# Codecs
codec-base64url = { package = "reallyme-codec-base64url", version = "=0.2.3" }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
identity-trust-openssl = { version = "0.1.0", path = "../openssl", optional = true }
identity-trust-tsl-openssl = { version = "0.1.0", path = "../tsl-openssl", optional = true, default-features = false }

[dev-dependencies]
openssl = "0.10"
reallyme-codec = { workspace = true, features = ["base64"] }

[lints]
workspace = true
