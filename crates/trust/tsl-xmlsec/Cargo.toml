[package]
name = "identity-trust-tsl-xmlsec"
version = "0.3.4"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Accept workspace-wide native builds without implicitly enabling the optional XMLSec backend.
native = []
# Enable the libxmlsec FFI backend. Requires xmlsec1-openssl >= 1.3.0,
# libxml2, libxslt, OpenSSL, and pkg-config.
xmlsec-ffi = ["identity-trust-tsl-xmlsec-sys"]

[dependencies]
reallyme-ssi-proto = { workspace = true }
reallyme-crypto = { workspace = true, features = ["sha2"] }
thiserror = { workspace = true }
quick-xml = "0.42"
codec-base64 = { package = "reallyme-codec-base64", version = "0.2.3" }
zeroize = { workspace = true, features = ["derive"] }
time = { workspace = true, features = ["parsing"] }

identity-trust-tsl-xmlsec-sys = { version = "0.3.4", path = "../tsl-xmlsec-sys", optional = true, features = ["xmlsec-ffi"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
