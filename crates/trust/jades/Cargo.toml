[package]
name = "reallyme-trust-jades"
version = "0.6.2"
description = "ETSI TS 119 182-1 JAdES Baseline validation for ReallyMe trust decisions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "ssi", "eidas"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = []
native = [
    "reallyme-trust-core/native",
    "reallyme-crypto/native",
    "envelopes-x509/native",
    "identity-revocation-core/native",
]
wasm = [
    "reallyme-trust-core/wasm",
    "reallyme-crypto/wasm",
    "envelopes-x509/wasm",
    "identity-revocation-core/wasm",
]

[dependencies]
envelopes-x509 = { workspace = true }
identity-revocation-core = { workspace = true }
reallyme-trust-core = { path = "../core", version = "0.6.2", default-features = false }
reallyme-codec = { workspace = true, features = ["base64", "base64url"] }
reallyme-crypto = { workspace = true, features = ["sha2", "sha3"] }
reallyme-ssi-proto = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
openssl = "0.10.81"

[lints]
workspace = true
