[package]
name = "identity-trust-tsl-core"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
reallyme-ssi-proto = { workspace = true }
reallyme-trust-x509 = { path = "../x509", version = "0.2.0", default-features = false }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
zeroize = { workspace = true, features = ["derive"] }
time = { workspace = true, features = ["parsing"] }
url = { workspace = true }
codec-base64 = { package = "reallyme-codec-base64", version = "=0.2.3" }
[lints]
workspace = true
