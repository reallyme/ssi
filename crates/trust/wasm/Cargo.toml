[package]
name = "identity-trust-wasm"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# The workspace frequently runs `--features native`; keep an empty feature for compatibility.
native = ["envelopes-x509/native", "reallyme-trust-core/native"]
wasm = ["envelopes-x509/wasm", "reallyme-trust-core/wasm"]

[dependencies]
reallyme-ssi-proto = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

# Core trust traits + policy evaluation.
reallyme-trust-core = { version = "0.2.0", path = "../core", default-features = false }
identity-trust-tsl-core = { version = "0.2.0", path = "../tsl-core" }
envelopes-x509 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Used only for generating test certificates on native hosts.
openssl = "0.10.81"
[lints]
workspace = true
