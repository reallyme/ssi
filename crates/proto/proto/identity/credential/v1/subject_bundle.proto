syntax = "proto3";

package identity.credential.v1;

import "identity/credential/v1/credential.proto";

option java_multiple_files = true;
option java_package = "me.really.identity.credential.v1";
option swift_prefix = "ReallyMeIdentityProto";

// SubjectPrivateBundle carries holder-private claim openings for a credential.
message SubjectPrivateBundle {
  // Present only for cryptographic holder binding. Claims-based and bearer
  // credentials carry no synthetic or empty key.
  PublicKeyRef holder_key = 1 [debug_redact = true];
  bytes envelope_hash = 2 [debug_redact = true]; // 32 bytes
  Signature issuer_signature = 3 [debug_redact = true];

  MerkleTreeInfo tree = 4 [debug_redact = true];
  repeated ClaimOpening claims = 5 [debug_redact = true];
}

// MerkleTreeInfo describes the committed claim tree.
message MerkleTreeInfo {
  uint32 depth = 1;
  uint32 count = 2;
}

// ClaimOpening carries one salted claim value and its Merkle authentication
// path.
message ClaimOpening {
  string claim_path = 1 [debug_redact = true]; // "/claims/age"
  bytes salt = 2 [debug_redact = true];
  bytes value = 3 [debug_redact = true]; // JCS bytes
  uint32 index = 4 [debug_redact = true];
  repeated bytes merkle_path = 5 [debug_redact = true]; // array of 32-byte hashes
}
