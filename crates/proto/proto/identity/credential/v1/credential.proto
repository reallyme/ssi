syntax = "proto3";

package identity.credential.v1;

import "google/protobuf/timestamp.proto";
import "identity/audit/v1/audit.proto";

option java_multiple_files = true;
option java_package = "me.really.identity.credential.v1";
option swift_prefix = "ReallyMeIdentityProto";

// CredentialKind identifies the kind of credential represented by an envelope.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_PID  = 1;
  CREDENTIAL_KIND_EAA  = 2;
  CREDENTIAL_KIND_QEAA = 3;
  // A general credential whose authority comes from the issuer and verifier
  // policy rather than an eIDAS credential category.
  CREDENTIAL_KIND_GENERIC = 4;
}

// AssuranceLevel identifies the EUDI assurance level of a credential.
enum AssuranceLevel {
  ASSURANCE_LEVEL_UNSPECIFIED = 0;
  ASSURANCE_LEVEL_SUBSTANTIAL = 1;
  ASSURANCE_LEVEL_HIGH = 2;
  // Baseline assurance for ordinary credentials outside a regulated profile.
  ASSURANCE_LEVEL_BASIC = 3;
}

// StatusPurpose identifies the status-list semantic being referenced.
enum StatusPurpose {
  STATUS_PURPOSE_UNSPECIFIED = 0;
  STATUS_PURPOSE_REVOCATION = 1;
  STATUS_PURPOSE_SUSPENSION = 2;
}

// Algorithm identifies credential key and signature algorithms used by the
// copied meproto credential shape.
enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_ED25519 = 1;
  ALGORITHM_X25519 = 2;
  ALGORITHM_P_256 = 3;
  ALGORITHM_SECP256K1 = 4;
  ALGORITHM_ES256K_RECOVERY = 5;
  ALGORITHM_ML_DSA_65 = 6;
  ALGORITHM_ML_DSA_87 = 7;
  ALGORITHM_ML_KEM_768 = 8;
  ALGORITHM_ML_KEM_1024 = 9;
  ALGORITHM_ML_DSA_44 = 10;
}

// PublicKeyMaterial carries one explicitly tagged public-key encoding. The
// representation is independent from the key's identifier and assurance.
message PublicKeyMaterial {
  Algorithm alg = 1;

  oneof representation {
    bytes jwk_json = 2 [debug_redact = true];
    bytes cose_key = 3 [debug_redact = true];
    string multikey = 4 [debug_redact = true];
    bytes subject_public_key_info_der = 5 [debug_redact = true];
    RawPublicKey raw = 6 [debug_redact = true];
  }
}

// RawPublicKey carries algorithm-specific octets plus their serialization.
// Raw bytes without this context are rejected at every public boundary.
message RawPublicKey {
  RawPublicKeySerialization serialization = 1;
  bytes bytes = 2 [debug_redact = true];
}

enum RawPublicKeySerialization {
  RAW_PUBLIC_KEY_SERIALIZATION_UNSPECIFIED = 0;
  RAW_PUBLIC_KEY_SERIALIZATION_FIXED_WIDTH = 1;
  RAW_PUBLIC_KEY_SERIALIZATION_SEC1_COMPRESSED = 2;
  RAW_PUBLIC_KEY_SERIALIZATION_SEC1_UNCOMPRESSED = 3;
}

// KeyReference identifies a verification key without treating every key as a
// DID verification method. A direct_public_key reference is meaningful only
// together with PublicKeyRef.public_key.
message KeyReference {
  oneof kind {
    string did_verification_method = 1 [debug_redact = true];
    bytes x509_certificate_der = 2 [debug_redact = true];
    DirectPublicKeyReference direct_public_key = 3;
  }
}

message DirectPublicKeyReference {}

// KeyAssurance records evidence separately from the key identifier and public
// material. Evidence bytes remain opaque until an applicable policy validates
// their profile-specific structure and trust chain.
message KeyAssurance {
  oneof kind {
    NoKeyAssurance none = 1;
    bytes key_attestation = 2 [debug_redact = true];
    bytes hardware_attestation = 3 [debug_redact = true];
    X509CertificateChain x509_chain = 4 [debug_redact = true];
  }
}

message NoKeyAssurance {}

message X509CertificateChain {
  repeated bytes certificates_der = 1 [debug_redact = true];
}

// PublicKeyRef keeps identifier, representation, and assurance as independent
// validated axes and never carries private key material.
message PublicKeyRef {
  KeyReference reference = 1 [debug_redact = true];
  PublicKeyMaterial public_key = 2 [debug_redact = true];
  KeyAssurance assurance = 3 [debug_redact = true];
}

// PartyReference identifies an issuer or credential subject. Absence is an
// explicit semantic state rather than an empty string.
message PartyReference {
  oneof kind {
    string did = 1 [debug_redact = true];
    X509SubjectReference x509_subject = 2 [debug_redact = true];
    PublicKeyMaterial public_key = 3 [debug_redact = true];
    string federation_entity_id = 4 [debug_redact = true];
    string opaque_identifier = 5 [debug_redact = true];
    string uri = 6 [debug_redact = true];
    AbsentPartyReference absent = 7;
  }
}

message AbsentPartyReference {}

message X509SubjectReference {
  oneof reference {
    bytes certificate_sha256 = 1 [debug_redact = true];
    X509IssuerAndSerial issuer_and_serial = 2 [debug_redact = true];
    bytes validated_certificate_der = 3 [debug_redact = true];
  }
}

message X509IssuerAndSerial {
  bytes issuer_name_der = 1 [debug_redact = true];
  bytes serial_number = 2 [debug_redact = true];
}

// HolderBinding states exactly how the authorised holder is constrained.
message HolderBinding {
  oneof mode {
    PublicKeyRef cryptographic_key = 1 [debug_redact = true];
    ClaimsBasedHolderBinding claims_based = 2 [debug_redact = true];
    BearerWithoutBinding bearer = 3;
  }
}

message ClaimsBasedHolderBinding {
  repeated string claim_ids = 1 [debug_redact = true];
}

message BearerWithoutBinding {}

// Signature carries an issuer signature and the verification method needed to
// validate it.
message Signature {
  PublicKeyRef verification_key = 1 [debug_redact = true];
  bytes raw_rs = 2 [debug_redact = true];
}

// CredentialEnvelope is the signed public credential envelope.
message CredentialEnvelope {
  // Canonical signing input:
  //   - CBOR encoding (RFC 8949 canonical form)
  //   - issuer_signature field MUST be excluded
  //   - issuer_signature signs the canonical bytes
  //
  // Signature encoding:
  //   - ECDSA signatures are stored as raw r||s (64 bytes)
  //   - DER signatures MUST be converted to raw before storage

  CredentialKind kind = 1;
  string profile_id = 2 [debug_redact = true];
  AssuranceLevel assurance = 3;
  PartyReference issuer_reference = 4 [debug_redact = true];
  string issuer_country = 5 [debug_redact = true];
  google.protobuf.Timestamp valid_from = 6 [debug_redact = true];
  google.protobuf.Timestamp valid_until = 7 [debug_redact = true];

  CredentialStatus status = 8 [debug_redact = true];
  CredentialSubject subject = 9 [debug_redact = true];
  ClaimsCommitment claims_commitment = 10 [debug_redact = true];

  // QEAA only (optional unless kind == QEAA)
  identity.audit.v1.QeaaCompliance qeaa_compliance = 11 [debug_redact = true];
  Signature issuer_signature = 12 [debug_redact = true];
}

// CredentialSubject separates the party claims concern from the holder
// authorised to present the credential.
message CredentialSubject {
  PartyReference subject_reference = 1 [debug_redact = true];
  HolderBinding holder_binding = 2 [debug_redact = true];
}

// CredentialStatus carries the status-list pointer for this credential.
message CredentialStatus {
  string status_list_url = 1 [debug_redact = true];
  bytes status_list_id = 2 [debug_redact = true];     // 32 bytes: sha256(list canonical bytes) or issuer-defined id
  uint64 status_list_index = 3 [debug_redact = true];
  StatusPurpose purpose = 4;
}

// ClaimsCommitment binds a credential envelope to holder-private claim openings.
message ClaimsCommitment {
  // merkle_root is computed over:
  //   - leaf hash = H(LEAF_TAG || H(CLM_TAG || len(value) || value || salt))
  //   - internal node hash = H(NODE_TAG || left || right)

  bytes merkle_root = 1 [debug_redact = true]; // 32 bytes
  string claimset_id = 2 [debug_redact = true];

  string hash_alg = 3; // "sha-256"
  string value_encoding = 4; // "JCS-UTF8"

  DomainTags domain_tags = 5;
  CommitmentLimits limits = 6;
}

// DomainTags provides domain separation labels for claim commitment hashing.
message DomainTags {
  string clm = 1;  // "CLM1"
  string leaf = 2; // "LEAF1"
  string node = 3; // "NODE1"
}

// CommitmentLimits records issuer-selected bounds for commitment material.
message CommitmentLimits {
  uint32 max_value_len = 1; // default 64
  uint32 salt_len = 2;      // default 16
}
