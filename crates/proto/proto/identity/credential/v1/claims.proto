syntax = "proto3";

package identity.credential.v1;

option java_multiple_files = true;
option java_package = "me.really.identity.credential.v1";
option swift_prefix = "ReallyMeIdentityProto";

// ClaimType identifies the semantic type of a credential claim value.
enum ClaimType {
  CLAIM_TYPE_UNSPECIFIED = 0;
  CLAIM_TYPE_STRING = 1;
  CLAIM_TYPE_BOOLEAN = 2;
  CLAIM_TYPE_INTEGER = 3;
  CLAIM_TYPE_NUMBER = 4;
  CLAIM_TYPE_OBJECT = 5;
  CLAIM_TYPE_ARRAY = 6;
  CLAIM_TYPE_SIGNED_INTEGER = 7;
  CLAIM_TYPE_UNSIGNED_INTEGER = 8;
  CLAIM_TYPE_DECIMAL = 9;
  CLAIM_TYPE_BYTES = 10;
  CLAIM_TYPE_DATE = 11;
  CLAIM_TYPE_DATE_TIME = 12;
  CLAIM_TYPE_NULL = 13;
}

// DisclosureMode identifies how a claim may be disclosed or proven.
enum DisclosureMode {
  DISCLOSURE_MODE_UNSPECIFIED = 0;
  DISCLOSURE_MODE_HIDDEN = 1;
  DISCLOSURE_MODE_REVEAL = 2;
  DISCLOSURE_MODE_EQ = 3;
  DISCLOSURE_MODE_GTE = 4;
  DISCLOSURE_MODE_LTE = 5;
  DISCLOSURE_MODE_RANGE = 6;
  DISCLOSURE_MODE_MEMBER_OF_SET = 7;
}

// ClaimsRegistry defines the semantic claim catalog for a credential profile.
message ClaimsRegistry {
  string claimset_id = 1;
  map<string, ClaimDefinition> claims = 2;
}

// ClaimDefinition defines one canonical credential claim.
message ClaimDefinition {
  string claim_id = 1;
  ClaimType type = 2;
  string encoding = 3;
  ClaimDisclosurePolicy disclosure = 4;
}

// ClaimDisclosurePolicy defines allowed reveal and predicate modes for a claim.
message ClaimDisclosurePolicy {
  bool allow_reveal = 1;
  repeated DisclosureMode predicates = 2;
}
