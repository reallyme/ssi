syntax = "proto3";

package identity.eudi.v1;

option java_multiple_files = true;
option java_package = "me.really.identity.eudi.v1";
option csharp_namespace = "Identity.Eudi.V1";
option swift_prefix = "ReallyMeIdentityProto";

enum EudiPidFormat {
  EUDI_PID_FORMAT_UNSPECIFIED = 0;
  EUDI_PID_FORMAT_SD_JWT_VC = 1;
  EUDI_PID_FORMAT_ISO_MDOC = 2;
}

enum EudiPidPortraitQuality {
  EUDI_PID_PORTRAIT_QUALITY_UNSPECIFIED = 0;
  EUDI_PID_PORTRAIT_QUALITY_NOT_ASSESSED_BEFORE_2028 = 1;
  EUDI_PID_PORTRAIT_QUALITY_ISO_39794_5 = 2;
  EUDI_PID_PORTRAIT_QUALITY_LEGACY_ISO_19794_5 = 3;
}

enum EudiPidSex {
  EUDI_PID_SEX_UNSPECIFIED = 0;
  EUDI_PID_SEX_NOT_KNOWN = 1;
  EUDI_PID_SEX_MALE = 2;
  EUDI_PID_SEX_FEMALE = 3;
  EUDI_PID_SEX_OTHER = 4;
  EUDI_PID_SEX_INTER = 5;
  EUDI_PID_SEX_DIVERSE = 6;
  EUDI_PID_SEX_OPEN = 7;
  EUDI_PID_SEX_NOT_APPLICABLE = 8;
}

enum EudiPidProviderAuthentication {
  EUDI_PID_PROVIDER_AUTHENTICATION_UNSPECIFIED = 0;
  EUDI_PID_PROVIDER_AUTHENTICATION_WALLET_RELYING_PARTY_ACCESS_CERTIFICATE = 1;
  EUDI_PID_PROVIDER_AUTHENTICATION_NOTIFIED_HIGH_ASSURANCE_EID = 2;
}

enum EudiPidRevocationReason {
  EUDI_PID_REVOCATION_REASON_UNSPECIFIED = 0;
  EUDI_PID_REVOCATION_REASON_WALLET_USER_REQUEST = 1;
  EUDI_PID_REVOCATION_REASON_WALLET_UNIT_ATTESTATION_REVOKED = 2;
  EUDI_PID_REVOCATION_REASON_PUBLISHED_POLICY_CAUSE = 3;
}

message EudiCalendarDate {
  uint32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
}

message EudiPidProviderMetadata {
  string issuing_authority = 1 [debug_redact = true];
  string issuing_country = 2;
  optional EudiCalendarDate expiry_date = 3;
  optional string document_number = 4 [debug_redact = true];
  optional string issuing_jurisdiction = 5;
  optional EudiCalendarDate issuance_date = 6;
}

message EudiPidValidityInterval {
  uint64 not_before = 1;
  uint64 not_after = 2;
}

message EudiPidSelectiveDisclosureFacts {
  uint32 disclosure_count = 1;
  uint32 signed_reference_count = 2;
  bool references_unambiguous = 3;
  bool algorithm_valid = 4;
}

message EudiPidAttributeEvidence {
  string evidence_type_uri = 1;
  string source_uri = 2;
  bytes sha256 = 3 [debug_redact = true];
}

message EudiPidRenewalService {
  string endpoint = 1;
  uint64 available_until = 2;
}

message EudiPidCommonProfileFacts {
  bool components_use_uri_names = 1;
  repeated string context_uris = 2;
  repeated string schema_uris = 3;
  optional string attestation_identifier_uri = 4 [debug_redact = true];
  optional uint64 issued_at = 5;
  repeated string audiences = 6;
  bool one_time_use = 7;
  repeated string terms_of_use_uris = 8;
  repeated EudiPidAttributeEvidence attribute_evidence = 9;
  optional EudiPidRenewalService renewal_service = 10;
}

message EudiPidCommonAttestationFacts {
  EudiPidFormat format = 1;
  string type_identifier = 2;
  optional string issuer_identifier = 3 [debug_redact = true];
  optional string issuer_country = 4;
  optional string issuer_name = 5 [debug_redact = true];
  uint64 technical_not_before = 6;
  uint64 technical_not_after = 7;
  optional EudiPidValidityInterval administrative_validity = 8;
  EudiPidCommonProfileFacts profile = 9;
  bool attribute_identifiers_complete = 10;
  bool attribute_values_complete = 11;
  bool attribute_subjects_complete = 12;
  optional EudiPidSelectiveDisclosureFacts selective_disclosure = 13;
  bool holder_public_key_bound = 14;
  bool issuer_signature_advanced = 15;
  bool status_present = 16;
  bool status_privacy_preserving = 17;
  bool status_binary_only = 18;
  bool status_irreversible = 19;
}

message EudiPidSdJwtFacts {
  string vct = 1;
  bool vct_integrity_valid = 2;
  bool validity_claims_match = 3;
  bool disclosure_algorithm_valid = 4;
  bool individual_claim_disclosure = 5;
  bool confirmation_key_present = 6;
  bool confirmation_key_wscd_protected = 7;
  bool protected_x5u_present = 8;
  bool protected_x5t_s256_present = 9;
}

message EudiPidMdocFacts {
  string doc_type = 1;
  string namespace = 2;
  bool device_key_present = 3;
  bool device_key_wscd_protected = 4;
  bool protected_x5u_present = 5;
  bool protected_x5t_sha256_present = 6;
  bool deterministic_cbor = 7;
  bool text_constraints_valid = 8;
  bool date_constraints_valid = 9;
}

message EudiPidBirthPlace {
  optional string country = 1;
  optional string region = 2 [debug_redact = true];
  optional string locality = 3 [debug_redact = true];
}

message EudiPidPortrait {
  EudiPidPortraitQuality quality = 1;
  oneof value {
    bytes mdoc_jpeg = 2 [debug_redact = true];
    string sd_jwt_jpeg_data_url = 3 [debug_redact = true];
    bool opted_out_empty = 4;
  }
}

message EudiNaturalPersonPidClaims {
  string family_name = 1 [debug_redact = true];
  string given_name = 2 [debug_redact = true];
  EudiCalendarDate birth_date = 3;
  EudiPidBirthPlace birth_place = 4;
  repeated string nationalities = 5;
  EudiPidPortrait portrait = 6;
  EudiCalendarDate assessment_date = 7;
  optional string resident_address = 8 [debug_redact = true];
  optional string resident_country = 9;
  optional string resident_state = 10 [debug_redact = true];
  optional string resident_city = 11 [debug_redact = true];
  optional string resident_postal_code = 12 [debug_redact = true];
  optional string resident_street = 13 [debug_redact = true];
  optional string personal_administrative_number = 14 [debug_redact = true];
  optional string family_name_birth = 15 [debug_redact = true];
  optional string given_name_birth = 16 [debug_redact = true];
  optional EudiPidSex sex = 17;
  optional string email = 18 [debug_redact = true];
  optional string mobile_phone_number = 19 [debug_redact = true];
}

message EudiNaturalPersonPidFacts {
  EudiPidCommonAttestationFacts common = 1;
  oneof format_facts {
    EudiPidSdJwtFacts sd_jwt = 2;
    EudiPidMdocFacts mdoc = 3;
  }
  EudiNaturalPersonPidClaims claims = 4;
  uint32 mandatory_disclosable = 5;
  uint32 optional_disclosable = 6;
  bool portrait_opt_out_authorized = 7;
  EudiPidProviderMetadata provider_metadata = 8;
}

message EudiLegalPersonPidFacts {
  string current_legal_name = 1 [debug_redact = true];
  string cross_border_identifier = 2 [debug_redact = true];
  optional string current_address = 3 [debug_redact = true];
  optional string vat_registration_number = 4 [debug_redact = true];
  optional string tax_reference_number = 5 [debug_redact = true];
  optional string european_unique_identifier = 6 [debug_redact = true];
  optional string legal_entity_identifier = 7 [debug_redact = true];
  optional string eori = 8 [debug_redact = true];
  optional string excise_number = 9 [debug_redact = true];
  EudiPidProviderMetadata provider_metadata = 10;
}

message EudiPidIssuanceAuthorizationFacts {
  string provider_identifier = 1 [debug_redact = true];
  string credential_issuer_identifier = 2 [debug_redact = true];
  EudiPidProviderAuthentication provider_authentication = 3;
  bool electronic_identification_scheme_authorized = 4;
  bool high_assurance_enrollment_complete = 5;
  bool identity_proofing_complete = 6;
  bool wallet_unit_attestation_valid = 7;
  bool wallet_solution_accepted = 8;
  bool authentication_data_complete = 9;
  bool cryptographically_bound_to_authenticated_wallet = 10;
}

message EudiPidAllocationKey {
  string member_state = 1;
  bytes subject_reference = 2 [debug_redact = true];
  bytes pid_identifier = 3 [debug_redact = true];
}

message EudiPidAllocationFacts {
  EudiPidAllocationKey candidate = 1;
  repeated EudiPidAllocationKey existing = 2;
}

message EudiPidRevocationFacts {
  string issuer_identifier = 1 [debug_redact = true];
  string revoking_actor_identifier = 2 [debug_redact = true];
  string public_policy_uri = 3;
  string public_status_uri = 4;
  EudiPidRevocationReason reason = 5;
  uint64 revoked_at = 6;
  uint64 user_notified_at = 7;
  bool secure_notification_included_reason = 8;
  bool public_status_privacy_preserving = 9;
  bool irreversible = 10;
  bool unlinkability_enabled_when_identity_not_required = 11;
}

message EudiPidValidation {
  bool valid = 1;
}
