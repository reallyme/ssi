[package]
name = "reallyme-credential"
version = "0.2.0"
description = "Protocol-neutral ReallyMe credential envelope model and validation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "credentials", "ssi", "eidas", "verifiable"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
conformance-vectors = []
native = [
    "reallyme-credential-audit/native",
    "reallyme-credential-claims/native",
    "reallyme-revocation/native",
    "reallyme-credential-status/native",
    "reallyme-crypto/native",
    "reallyme-crypto/csprng",
    "reallyme-crypto/dispatch",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/p256",
    "reallyme-crypto/secp256k1",
    "crypto-dispatch/native",
    "crypto-signer/native",
    "dep:crypto-core",
    "dep:crypto-dispatch",
    "dep:crypto-signer",
    "credential-crypto",
]
credential-crypto = [
    "reallyme-crypto/dispatch",
    "reallyme-crypto/sha2",
]
dispatch-signatures = [
    "reallyme-crypto/dispatch",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/p256",
    "reallyme-crypto/secp256k1",
    "reallyme-crypto/ml-dsa-44",
    "reallyme-crypto/ml-dsa-65",
    "reallyme-crypto/ml-dsa-87",
]
proto = [
    "dep:buffa-types",
    "reallyme-credential-claims/proto",
]
wasm = [
    "reallyme-credential-audit/wasm",
    "reallyme-credential-claims/wasm",
    "reallyme-revocation/wasm",
    "reallyme-credential-status/wasm",
    "reallyme-crypto/wasm",
    "reallyme-crypto/csprng",
    "reallyme-crypto/dispatch",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/p256",
    "reallyme-crypto/secp256k1",
    "crypto-dispatch/wasm",
    "crypto-signer/wasm",
    "dep:crypto-core",
    "dep:crypto-dispatch",
    "dep:crypto-signer",
    "credential-crypto",
]

[dependencies]
buffa = { workspace = true }
buffa-types = { workspace = true, optional = true }
reallyme-credential-audit = { path = "../audit", version = "0.2.0", default-features = false }
reallyme-credential-claims = { path = "../claims", version = "0.2.0", default-features = false, features = ["proto"] }
reallyme-revocation = { path = "../revocation", version = "0.2.0", default-features = false }
reallyme-credential-status = { path = "../status", version = "0.2.0", default-features = false }
reallyme-ssi-proto = { workspace = true }
reallyme-codec = { workspace = true, features = ["cbor"] }
reallyme-crypto = { workspace = true }
thiserror = { workspace = true }
reallyme-trust-x509 = { path = "../trust/x509", version = "0.2.0", default-features = false }
zeroize = { workspace = true }
serde_json = { workspace = true }
codec-cbor = { package = "reallyme-codec-cbor", version = "=0.2.3" }
ciborium = { workspace = true }
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.9", optional = true }
crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.3.9", default-features = false, optional = true }
crypto-signer = { package = "reallyme-crypto-signer", version = "=0.3.9", default-features = false, optional = true }

[dev-dependencies]
reallyme-codec = { workspace = true, features = ["base64url", "multikey"] }
reallyme-cose = { workspace = true, features = ["native"] }
serde_json = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
