[package]
name = "identity-vc-jwt"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
native = [
    "crypto-dispatch/native",
    "crypto-signer/native",
    "envelopes-jwt/native",
    "reallyme-credential/native",
]
wasm = [
    "crypto-dispatch/wasm",
    "crypto-signer/wasm",
    "envelopes-jwt/wasm",
    "reallyme-credential/wasm",
]

[dependencies]
reallyme-ssi-proto = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }

codec-base64url = { package = "reallyme-codec-base64url", version = "=0.2.3" }

envelopes-jwt = { workspace = true }
envelopes-jwk = { package = "reallyme-crypto-jwk", version = "=0.3.9", default-features = false }
crypto-signer = { package = "reallyme-crypto-signer", version = "=0.3.9", default-features = false }

reallyme-credential = { version = "0.2.0", path = "../..", default-features = false }

crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.3.9", default-features = false }
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.9" }
[lints]
workspace = true
