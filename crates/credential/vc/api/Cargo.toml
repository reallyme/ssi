[package]
name = "identity-credential-vc-api"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata.cargo-machete]
# This optional edge is consumed by the native/wasm feature forwarding below.
ignored = ["envelopes-jwt"]

[features]
default = ["native", "jwt", "ietf-sd-jwt"]

native = [
    "envelopes-jwt/native",
    "reallyme-credential/native",
    "identity-vc-ietf-sd-jwt?/native",
    "identity-vc-jwt?/native",
    "crypto-signer/native"
]

wasm = [
    "envelopes-jwt/wasm",
    "reallyme-credential/wasm",
    "identity-vc-ietf-sd-jwt?/wasm",
    "identity-vc-jwt?/wasm",
    "crypto-signer/wasm"
]

jwt = [
    "dep:identity-vc-jwt",
    "dep:envelopes-jwk",
    "dep:envelopes-jwt"
]

ietf-sd-jwt = [
    "dep:identity-vc-ietf-sd-jwt",
    "dep:envelopes-jwk",
    "dep:envelopes-jwt"
]

[dependencies]
serde_json = "1.0"
thiserror = { workspace = true }
zeroize = { workspace = true }

# ---- Shared credential model + validation ----
reallyme-credential = { version = "0.1.0", path = "../..", default-features = false }
identity-credential-claims-core = { workspace = true }
reallyme-credential-audit = { workspace = true }
identity-core-primitives = { workspace = true }
reallyme-ssi-proto = { workspace = true }

# ---- Crypto ----
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.9" }
crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.3.9" }
crypto-signer = { package = "reallyme-crypto-signer", version = "=0.3.9", default-features = false }

# ---- Encoding / utilities ----
codec-base64url = { package = "reallyme-codec-base64url", version = "=0.2.3" }

# ---- Optional public encoders ----
identity-vc-jwt = { version = "0.1.0", path = "../jwt", optional = true }
identity-vc-ietf-sd-jwt = { version = "0.1.0", path = "../ietf-sd-jwt", optional = true }

envelopes-jwk = { package = "reallyme-crypto-jwk", version = "=0.3.9", optional = true }
envelopes-jwt = { workspace = true, optional = true }
[lints]
workspace = true
