[package]
name = "identity-vc-ietf-sd-jwt"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
native = ["envelopes-jwk/native", "envelopes-jwt/native", "reallyme-crypto/native"]
wasm = ["envelopes-jwk/wasm", "envelopes-jwt/wasm", "reallyme-crypto/wasm"]
reference-tests = []
conformance-vectors = []

[dependencies]
reallyme-ssi-proto = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
zeroize = { workspace = true }
reallyme-crypto = { workspace = true, features = ["constant-time", "csprng"] }
crypto-sha2-256 = { package = "reallyme-crypto-sha2-256", version = "=0.3.9" }

codec-base64url = { package = "reallyme-codec-base64url", version = "=0.2.3" }

# JWT / JWK
envelopes-jwt = { workspace = true }
envelopes-jwk = { package = "reallyme-crypto-jwk", version = "=0.3.9", default-features = false }

# --- Crypto ---
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.9" }
crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.3.9", default-features = false }
crypto-signer = { package = "reallyme-crypto-signer", version = "=0.3.9", default-features = false }

[dev-dependencies]
serde_json = "1.0"
crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.3.9" }
crypto-sha2-256 = { package = "reallyme-crypto-sha2-256", version = "=0.3.9" }

[lints]
workspace = true
