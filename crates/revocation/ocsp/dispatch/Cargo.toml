[package]
name = "identity-revocation-ocsp-dispatch"
version = "0.4.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Platform-dispatched OCSP parsing + verification returning ParsedOcspResponse."

[lib]
crate-type = ["rlib"]

[features]
default = []

# Native uses the OpenSSL backend.
native = ["dep:identity-revocation-ocsp-openssl", "dep:openssl"]

wasm = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
identity-revocation-ocsp-core = { version = "0.4.1", path = "../core" }
identity-revocation-core = { workspace = true }
envelopes-x509 = { workspace = true }
reallyme-crypto = { workspace = true }

serde_json = "1.0"
codec-base64url = { package = "reallyme-codec-base64url", version = "0.3.1" }

# Native backend deps
identity-revocation-ocsp-openssl = { version = "0.4.1", path = "../openssl", default-features = false, optional = true }
openssl = { version = "0.10", optional = true }

# WASM backend deps
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
time = "0.3"

[lints]
workspace = true
