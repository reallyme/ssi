[package]
name = "reallyme-did-method-ion"
version = "0.7.0"
description = "did:ion identifiers with authenticated Sidetree initial-state commitments."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "ssi", "credentials"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = ["reallyme-crypto/native"]
wasm = ["reallyme-crypto/wasm"]

[dependencies]
identity-core-primitives = { workspace = true }
reallyme-codec = { workspace = true, features = ["base64url", "jcs"] }
reallyme-crypto = { workspace = true, default-features = false, features = ["sha2"] }
serde_json = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
reallyme-ssi-proto = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
