[package]
name = "reallyme-did-method-jwk"
version = "0.6.2"
description = "did:jwk deterministic identifier helpers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "ssi", "credentials"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = ["reallyme-crypto/native"]
wasm = ["reallyme-crypto/wasm"]

[dependencies]
curve25519-dalek.workspace = true
identity-core-primitives = { workspace = true }
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-crypto = { workspace = true, features = ["ed25519", "p256", "p384", "p521", "secp256k1", "x25519"] }
reallyme-ssi-proto = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
