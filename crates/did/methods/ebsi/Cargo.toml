[package]
name = "reallyme-did-method-ebsi"
version = "0.6.1"
description = "did:ebsi versioned base58btc identifier helpers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "ssi", "credentials"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = ["reallyme-did-method-jwk/native"]
wasm = ["reallyme-did-method-jwk/wasm"]

[dependencies]
identity-core-primitives = { workspace = true }
reallyme-did-method-jwk = { path = "../jwk", version = "0.6.1", default-features = false }
reallyme-ssi-proto = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
reallyme-codec = { workspace = true, features = ["base64url"] }

[lints]
workspace = true
