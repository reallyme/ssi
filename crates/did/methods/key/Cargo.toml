[package]
name = "reallyme-did-method-key"
version = "0.3.1"
description = "did:key multibase and multicodec identifier helpers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["reallyme-crypto/native"]
wasm = ["reallyme-crypto/wasm"]

[dependencies]
curve25519-dalek.workspace = true
reallyme-crypto = { workspace = true, features = ["ed25519", "p256", "p384", "secp256k1", "x25519"] }
reallyme-ssi-proto = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
