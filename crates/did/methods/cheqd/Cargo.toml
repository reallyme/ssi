[package]
name = "reallyme-did-method-cheqd"
version = "0.6.2"
description = "did:cheqd namespace and unique identifier helpers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["identity", "ssi", "credentials"]
categories = ["authentication", "data-structures"]
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = []
wasm = []

[dependencies]
reallyme-ssi-proto = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
