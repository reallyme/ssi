[package]
name = "reallyme-did-api"
version = "0.4.0"
description = "Ergonomic Rust API for ReallyMe DID generation, update, validation, and proto transport."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = [
    "reallyme-crypto/native",
    "reallyme-did-core/native",
    "reallyme-did-method-me/native",
    "reallyme-did-method-cheqd/native",
    "reallyme-did-method-ebsi/native",
    "reallyme-did-method-ion/native",
    "reallyme-did-method-jwk/native",
    "reallyme-did-method-key/native",
    "reallyme-did-method-web/native",
    "reallyme-keys/native",
]
wasm = [
    "reallyme-crypto/wasm",
    "reallyme-did-core/wasm",
    "reallyme-did-method-me/wasm",
    "reallyme-did-method-cheqd/wasm",
    "reallyme-did-method-ebsi/wasm",
    "reallyme-did-method-ion/wasm",
    "reallyme-did-method-jwk/wasm",
    "reallyme-did-method-key/wasm",
    "reallyme-did-method-web/wasm",
    "reallyme-keys/wasm",
]

[dependencies]
reallyme-compression-brotli = { path = "../../../compression/brotli", version = "0.4.0" }
reallyme-crypto = { workspace = true, features = ["csprng", "dispatch", "ed25519", "ml-dsa-87", "ml-kem-768", "ml-kem-1024", "p256", "secp256k1", "x25519"] }
identity-core-primitives = { package = "reallyme-ssi-core", path = "../common", version = "0.4.0" }
reallyme-ssi-proto = { workspace = true }
reallyme-did-core = { path = "../engine", version = "0.4.0", default-features = false }
reallyme-did-method-me = { path = "../../methods/me", version = "0.4.0", default-features = false }
reallyme-did-method-cheqd = { path = "../../methods/cheqd", version = "0.4.0", default-features = false }
reallyme-did-method-ebsi = { path = "../../methods/ebsi", version = "0.4.0", default-features = false }
reallyme-did-method-ion = { path = "../../methods/ion", version = "0.4.0", default-features = false }
reallyme-did-method-jwk = { path = "../../methods/jwk", version = "0.4.0", default-features = false }
reallyme-did-method-key = { path = "../../methods/key", version = "0.4.0", default-features = false }
reallyme-did-method-web = { path = "../../methods/web", version = "0.4.0", default-features = false }
reallyme-ssi-proto-codec = { workspace = true }
reallyme-did-types = { path = "../types", version = "0.4.0" }
reallyme-keys = { path = "../../../keys", version = "0.4.0", default-features = false }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
zeroize = { workspace = true }

[dev-dependencies]
reallyme-cose = { workspace = true, features = ["native"] }

[lints]
workspace = true
