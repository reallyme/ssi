[package]
name = "reallyme-ssi-core"
version = "0.1.0"
description = "Semantic algorithm, canonicalization, and profile registry primitives for ReallyMe identity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["identity", "ssi", "did", "credentials"]
categories = ["authentication", "data-structures"]
publish = true
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
reallyme-ssi-proto = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
