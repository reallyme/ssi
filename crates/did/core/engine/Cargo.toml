[package]
name = "reallyme-did-core"
version = "0.2.0"
description = "DID identity-core document generation, validation, canonical state, and update logic."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["envelopes-data-integrity/native", "reallyme-crypto/native"]
wasm = ["envelopes-data-integrity/wasm", "reallyme-crypto/wasm"]

[dependencies]
reallyme-codec = { workspace = true, features = ["base64url", "cbor", "multikey"] }
reallyme-crypto = { workspace = true, features = ["dispatch", "ed25519", "ml-dsa-87", "ml-kem-768", "ml-kem-1024", "p256", "secp256k1", "sha2", "x25519"] }
envelopes-data-integrity = { path = "../../../envelopes/data_integrity", version = "0.2.0", default-features = false }
identity-core-primitives = { package = "reallyme-ssi-core", path = "../common", version = "0.2.0" }
reallyme-ssi-proto = { workspace = true }
reallyme-did-types = { path = "../types", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Exercise canonicalization with insertion-ordered serde_json maps so a
# transitive preserve_order feature cannot weaken key ordering silently.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
