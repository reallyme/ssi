name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "fuzz/**"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "fuzz/**"
      - "!**/*.md"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-09-01

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: reallyme/ssi

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        working-directory: reallyme/ssi
        run: cargo +nightly-2026-09-01 fuzz build

  scheduled:
    name: scheduled fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_claim_path
          - fuzz_claim_set
          - fuzz_mdoc_device_response
          - fuzz_parse_tsl_xml
          - fuzz_sd_jwt_processing
          - fuzz_xml_signature_profile
          - fuzz_jades_header
          - fuzz_status_tokens
          - fuzz_status_list
          - fuzz_x509_trust_der
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-09-01

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: reallyme/ssi

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run time-boxed fuzz target
        working-directory: reallyme/ssi
        run: cargo +nightly-2026-09-01 fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: reallyme/ssi/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
