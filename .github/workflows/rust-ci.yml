name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    # Release preflight still requires a successful exact-commit run. Manually
    # dispatch this workflow when a Markdown-only HEAD is a release candidate.
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2
  CARGO_NEXTEST_VERSION: 0.9.140
  CARGO_SEMVER_CHECKS_VERSION: 0.50.0
  CARGO_MUTANTS_VERSION: 27.1.0

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0

      - name: Check the native workspace at the declared MSRV
        working-directory: reallyme/ssi
        run: cargo +1.99.0 check --locked --workspace --no-default-features --features native

  fuzz-build:
    name: Build fuzz targets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-09-01

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build every fuzz target
        working-directory: reallyme/ssi
        run: cargo +nightly-2026-09-01 fuzz build

  security-mutations:
    name: Security mutation gate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oauth-dpop
            package: reallyme-openid-oauth
            file: crates/oauth/src/dpop.rs
            examine: 'Dpop(?:Header|Claims|Proof)::validate|validate_dpop_public_jwk'
          - name: sd-jwt-holder-binding
            package: reallyme-sd-jwt
            file: crates/envelopes/sd_jwt/src/holder_binding.rs
            examine: 'verify_key_binding_jwt|KeyBindingVerificationOptions.*validate|validate_key_binding_confirmation'
          - name: status-freshness
            package: reallyme-credential-status
            file: crates/status/src/token_status_list/check_freshness.rs
            examine: check_freshness
          - name: credential-envelope
            package: reallyme-credential
            file: crates/credential/src/committed/signed_envelope.rs
            examine: 'decode_signed_envelope_cbor|validate_nonempty_bounded_length'
          - name: revocation-composite
            package: reallyme-revocation
            file: crates/revocation/src/composite.rs
            examine: 'CompositeStatusChecker.*check|handle_non_terminal'
          - name: presentation-decision
            package: reallyme-vp-api
            file: crates/presentation/api/src/commands/decision.rs
            examine: decision_from_checks
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0

      - name: Install cargo-mutants
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      - name: Require security tests to kill mutations
        working-directory: reallyme/ssi
        run: >-
          cargo mutants --package "${{ matrix.package }}"
          --file "${{ matrix.file }}" --examine-re '${{ matrix.examine }}'
          --timeout 300 --jobs 2

  semver:
    name: Public API semver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      # cargo-semver-checks consumes rustdoc JSON, whose schema follows the
      # compiler. Pin both so an upstream toolchain release cannot change the
      # release gate without a reviewed repository change.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: reallyme/ssi

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}

      # Check compatible updates per public crate. A pre-1.0 minor bump is a
      # breaking release, for which cargo-semver-checks executes no API checks.
      - name: Check planned public crate versions against crates.io
        working-directory: reallyme/ssi
        run: node scripts/check_release_semver.mjs

  rust:
    name: fmt, lint, test, dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false
          # Wire-compatibility compares against the latest published release
          # tag, so this job requires tags and their reachable history.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        working-directory: reallyme/ssi
        run: cargo fmt --check

      - name: Checkout pinned JOSE conformance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/jose
          ref: 1e421cffb9daabf445affe19cc9e7872c376b845
          path: reallyme/jose
          persist-credentials: false

      - name: Checkout pinned COSE conformance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/cose
          ref: 107cb2a76145c0466db4dac4a524c44d671d1dbb
          path: reallyme/cose
          persist-credentials: false

      - name: Checkout shared protobuf contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: me-id/protos
          ref: 4be77725510185b29964ffdce7a62942179aaff8
          path: me-id/protos
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 5c2da5e5d5795c2c895d0dca0819287ee7101207
          path: reallyme/ssi/.release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: reallyme/ssi

      - name: Install nextest
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.73.0

      - name: Install Buffa generators
        run: |
          cargo install protoc-gen-buffa --version 0.9.2 --locked
          cargo install protoc-gen-buffa-packaging --version 0.9.2 --locked

      - name: Install XMLSec build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl libssl-dev libtool libxml2-dev libxslt1-dev pkg-config

      - name: Build pinned XMLSec OpenSSL backend
        working-directory: reallyme/ssi
        run: |
          sh scripts/install-xmlsec-linux.sh "${RUNNER_TEMP}/xmlsec"
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/xmlsec/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/xmlsec/lib" >> "${GITHUB_ENV}"

      - name: Lint protobuf contracts
        working-directory: reallyme/ssi
        run: sh scripts/lint-protos.sh

      - name: Check protobuf boundary rules
        working-directory: reallyme/ssi
        run: sh scripts/check-proto-contract.sh

      - name: Check proto-first repository boundaries
        working-directory: reallyme/ssi
        run: node scripts/check-proto-first-boundaries.mjs

      - name: Check protobuf redaction and cleanup coverage
        working-directory: reallyme/ssi
        run: node scripts/check_proto_zeroize_coverage.mjs

      - name: Check generated Buffa freshness
        working-directory: reallyme/ssi
        run: sh scripts/check-protos-fresh.sh

      - name: Check protobuf wire compatibility
        working-directory: reallyme/ssi
        run: scripts/check-protos-breaking.sh "$(git describe --tags --match 'reallyme-ssi-v*' --abbrev=0 HEAD^)"

      - name: Check conformance requirement coverage
        working-directory: reallyme/ssi
        run: node scripts/check_conformance_coverage.mjs

      - name: Execute pinned upstream conformance evidence
        working-directory: reallyme/ssi
        run: >-
          node scripts/run_upstream_conformance_tests.mjs
          --source reallyme-jose=../jose
          --source reallyme-cose=../cose
          --output "${RUNNER_TEMP}/upstream-conformance.json"

      - name: Check copied fixtures match canonical vectors
        working-directory: reallyme/ssi
        run: node scripts/check_fixture_copies.mjs

      - name: Check public API evolution policy
        working-directory: reallyme/ssi
        run: node scripts/check_public_api_evolution.mjs

      - name: Generate conformance evidence from the clean CI commit
        working-directory: reallyme/ssi
        run: >-
          node scripts/generate_conformance_reports.mjs
          --output-dir "${RUNNER_TEMP}/ssi-conformance"
          --upstream-results "${RUNNER_TEMP}/upstream-conformance.json"

      - name: Upload exact-source upstream conformance result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-ssi-upstream-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/upstream-conformance.json
          if-no-files-found: error
          retention-days: 30

      - name: Check all features with warnings denied
        working-directory: reallyme/ssi
        run: cargo check --locked --workspace --all-features
        env:
          RUSTFLAGS: -Dwarnings

      - name: Clippy
        working-directory: reallyme/ssi
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test native lane
        working-directory: reallyme/ssi
        run: node scripts/run_bounded_nextest.mjs native

      - name: Test all features
        working-directory: reallyme/ssi
        run: node scripts/run_bounded_nextest.mjs all-features

      - name: Test workspace default features
        working-directory: reallyme/ssi
        run: node scripts/run_bounded_nextest.mjs default

      - name: Test OpenSSL crates without workspace feature unification
        working-directory: reallyme/ssi
        run: |
          set -euo pipefail
          for package in \
            identity-revocation-crl-openssl \
            identity-revocation-ocsp-openssl \
            identity-trust-openssl \
            identity-trust-tsl-openssl; do
            cargo nextest run --locked -p "${package}" --all-features
          done

      - name: Doc build
        working-directory: reallyme/ssi
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Documentation examples
        working-directory: reallyme/ssi
        run: cargo test --locked --doc --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check native lane
        working-directory: reallyme/ssi
        run: cargo check --locked --workspace --no-default-features --features native

      - name: Check wasm lane
        working-directory: reallyme/ssi
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select((.publish == null) or (.publish | length > 0)) | select(.features.wasm != null) | .name' \
            | while IFS= read -r package; do
                cargo check --locked -p "${package}" --no-default-features --features wasm --target wasm32-unknown-unknown
              done
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select((.publish == null) or (.publish | length > 0)) | select(.features.wasm == null) | .name' \
            | while IFS= read -r package; do
                cargo check --locked -p "${package}" --no-default-features --target wasm32-unknown-unknown
              done
          cargo check --locked -p reallyme-ssi --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Check wasm lane excludes native providers
        working-directory: reallyme/ssi
        run: |
          set -euo pipefail
          tree_output="$(cargo tree --locked -e normal,build -e features --target wasm32-unknown-unknown \
              -p reallyme-ssi --no-default-features --features wasm)"
          if grep -E 'reallyme-(crypto|cose|jose)(-[a-z0-9-]+)? feature "native"|(^|[[:space:]])(openssl|xmlsec)(-sys)? v' <<<"${tree_output}"; then
            echo "native crypto providers are enabled in the wasm artifact" >&2
            exit 1
          fi

      - name: Install Wasm test runner
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Test fail-closed Wasm provider boundaries
        working-directory: reallyme/ssi
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked -p identity-revocation-ocsp-dispatch
          --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Check shared dependency boundaries
        working-directory: reallyme/ssi
        run: node scripts/check-shared-dependency-boundaries.mjs

      - name: Release readiness
        working-directory: reallyme/ssi
        run: node .release-readiness/scripts/run-consumer-check.mjs

      - name: Inspect and test normalized crate archives
        working-directory: reallyme/ssi
        run: node scripts/publish_crates_in_order.mjs inspect

      - name: Test repository scripts
        working-directory: reallyme/ssi
        run: node --test scripts/*.test.mjs

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Dependency policy
        working-directory: reallyme/ssi
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Security advisory audit
        working-directory: reallyme/ssi
        run: scripts/audit_committed_lockfiles.sh

  platform-boundaries:
    name: OCSP mobile fail-closed lane (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple
            runner: macos-15
            target: aarch64-apple-ios
          - name: Android
            runner: ubuntu-24.04
            target: aarch64-linux-android
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: reallyme/ssi
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Type-check fail-closed OCSP lane for mobile targets
        working-directory: reallyme/ssi
        env:
          TARGET_ARGUMENT: ${{ matrix.target }}
        run: >-
          cargo check --locked -p reallyme-ssi -p identity-credential-trust-api
          --no-default-features --features native --target "$TARGET_ARGUMENT"
