[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = [
    { crate = "base64@0.22.1", reason = "Transitive dependencies require incompatible base64 API lines; every other duplicate remains denied." },
    { crate = "block-buffer@0.10.4", reason = "Digest dependencies require incompatible block-buffer API lines; every other duplicate remains denied." },
    { crate = "cpufeatures@0.2.17", reason = "Cryptographic dependencies require incompatible cpufeatures API lines; every other duplicate remains denied." },
    { crate = "crypto-common@0.1.7", reason = "Cryptographic dependencies require incompatible crypto-common API lines; every other duplicate remains denied." },
    { crate = "digest@0.10.7", reason = "Digest dependencies require incompatible digest API lines; every other duplicate remains denied." },
    { crate = "generic-array@0.14.7", reason = "Cryptographic dependencies require incompatible generic-array API lines; every other duplicate remains denied." },
    { crate = "hashbrown@0.15.5", reason = "Collection dependencies require incompatible hashbrown API lines; every other duplicate remains denied." },
    { crate = "keccak@0.1.6", reason = "SHA-3 dependencies require incompatible keccak API lines; every other duplicate remains denied." },
    { crate = "sha3@0.10.9", reason = "Cryptographic dependencies require incompatible sha3 API lines; every other duplicate remains denied." },
    { crate = "sha3@0.11.0", reason = "Cryptographic dependencies require incompatible sha3 API lines; every other duplicate remains denied." },
    { crate = "syn@2.0.119", reason = "Procedural-macro dependencies require incompatible syn API lines; every other duplicate remains denied." },
    { crate = "synstructure@0.13.2", reason = "ASN.1 and multihash derives require synstructure 0.13, while ICU derives require 0.14; every other duplicate remains denied." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
