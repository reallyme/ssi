[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = [
    { crate = "base64@0.22.1", reason = "Reviewed transitive compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "block-buffer@0.10.4", reason = "Reviewed transitive digest compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "cpufeatures@0.2.17", reason = "Reviewed transitive crypto compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "crypto-common@0.1.7", reason = "Reviewed transitive crypto compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "digest@0.10.7", reason = "Reviewed transitive digest compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "generic-array@0.14.7", reason = "Reviewed transitive crypto compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "getrandom@0.2.17", reason = "Reviewed transitive random-source compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "hashbrown@0.15.5", reason = "Reviewed transitive collection compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "keccak@0.1.6", reason = "Reviewed transitive SHA-3 compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "sha3@0.10.9", reason = "Reviewed transitive SHA-3 compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "sha3@0.11.0", reason = "Reviewed transitive SHA-3 compatibility split; deny-by-default prevents additional unreviewed versions." },
    { crate = "syn@2.0.119", reason = "Reviewed procedural-macro compatibility split; deny-by-default prevents additional unreviewed versions." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
